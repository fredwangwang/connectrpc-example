[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
connectrpc = { version = "0.9.1", features = ["client"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[build-dependencies]
connectrpc-build = "0.9.0"
